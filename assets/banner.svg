<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Film - solo builder: web, AI agents, trading systems">
  <defs>
    <!-- WebPV brand ramp: one amber accent, deep to light -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#BA7419"/>
      <stop offset="50%"  stop-color="#EFA555"/>
      <stop offset="100%" stop-color="#FFBF6F"/>
    </linearGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#BA7419" stop-opacity="0.9"/>
      <stop offset="45%"  stop-color="#EFA555" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFBF6F" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft ambient light, built from gradient stops so it survives SVG sanitizers -->
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#EFA555" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#EFA555" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLift" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#FFBF6F" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFBF6F" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#FFFFFF" opacity="0.05"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1200" height="280" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#0A0A0A"/>
    <rect x="620" width="580" height="280" fill="url(#dots)"/>

    <ellipse cx="960" cy="60"  rx="420" ry="240" fill="url(#glowWarm)"/>
    <ellipse cx="1180" cy="250" rx="360" ry="220" fill="url(#glowLift)"/>

    <!-- Aurora ribbons: quiet motif, never louder than the wordmark -->
    <g fill="none" stroke="url(#brand)" stroke-linecap="round">
      <path d="M700 250 C 820 150, 940 240, 1210 90"  stroke-width="2"   opacity="0.55"/>
      <path d="M700 285 C 840 180, 980 270, 1210 130" stroke-width="1.5" opacity="0.32"/>
      <path d="M700 215 C 810 130, 930 200, 1210 50"  stroke-width="1"   opacity="0.20"/>
    </g>

    <text x="72" y="86" fill="#6B6B6B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="19" letter-spacing="7">YIMWIRED</text>

    <text x="70" y="182" fill="url(#brand)" font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="104" font-weight="700" letter-spacing="-2">FILM</text>

    <text x="74" y="228" fill="#A4A4A4" font-family="Inter, ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="21" letter-spacing="1.5">Solo builder · web · AI agents · trading systems</text>

    <rect x="72" y="252" width="600" height="2" rx="1" fill="url(#rule)"/>
  </g>
</svg>
