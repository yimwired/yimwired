<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2" viewBox="0 0 1200 2" role="presentation">
  <defs>
    <!-- One champagne hairline, the gold of WebPV's midnight zone, fading at both ends -->
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#E3BD70" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#E3BD70" stop-opacity="0.7"/>
      <stop offset="78%"  stop-color="#E3BD70" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#E3BD70" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="2" rx="1" fill="url(#hairline)"/>
</svg>
