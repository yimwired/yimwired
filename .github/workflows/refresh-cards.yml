name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 10:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-cards.mjs
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the stat cards
        run: node scripts/build-cards.mjs
        env:
          # PROFILE_TOKEN is a personal token with read:user; it lets the
          # contribution card count private work. Without it the card falls
          # back to public commits and still builds.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit only when a card actually changed
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"
          git push
