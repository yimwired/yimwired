name: Refresh profile cards

on:
  schedule:
    - cron: "17 3 * * *" # daily, 10:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-cards.mjs
      - .github/workflows/refresh-cards.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild the stat cards
        run: node scripts/build-cards.mjs
        env:
          # PROFILE_TOKEN is a personal token with read:user; it lets the
          # contribution card count private work. Both are passed rather than
          # one falling back to the other in this expression: a PROFILE_TOKEN
          # that has expired is still a non-empty secret, so `||` would keep
          # choosing it and every run would 401. The script tries this one
          # first and drops to the runner's own token when it is rejected,
          # which has the rate limit an unauthenticated run does not.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit only when a card actually changed
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain assets)" ]; then
            echo "cards unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: refresh profile cards"

          # A push to main while this job is running leaves the checkout on the
          # old ref and the push is rejected. The cards are generated, not
          # authored, so the answer is to take the newer ref and draw them
          # again rather than to merge: whatever landed meanwhile is kept, and
          # the cards on top of it are built from the same run's data.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebuilding on top of origin/main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-cards.mjs
            git add assets
            if git diff --cached --quiet; then
              echo "cards already current on the new ref"
              exit 0
            fi
            git commit -m "chore: refresh profile cards"
          done
          echo "could not push after three attempts"
          exit 1
